name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Lint, format and validate
    runs-on: ubuntu-latest

    # A newer commit supersedes an in-flight check run.
    concurrency:
      group: check-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: ESLint
        run: pnpm run lint

      - name: Prettier
        run: pnpm run format:check

      - name: Validate club data
        run: pnpm run validate

      - name: Tests
        run: pnpm test

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest

    concurrency:
      group: e2e-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Playwright
        run: pnpm run test:e2e

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # The one check the ruleset on main requires. It passes only when the jobs
  # above do, so they can be renamed, split or added to without editing the
  # ruleset. Without `always()` it would be skipped, not failed, when one of
  # them fails, and a skipped required check counts as passed.
  ci:
    name: CI
    needs: [check, e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require the checks above
        env:
          CHECK: ${{ needs.check.result }}
          E2E: ${{ needs.e2e.result }}
        run: |
          if [ "$CHECK" != success ] || [ "$E2E" != success ]; then
            echo "::error::Lint, format and validate: $CHECK. End-to-end tests: $E2E."
            exit 1
          fi

  deploy-pages:
    name: Deploy to GitHub Pages (staging)
    # Only publish what has already passed the checks above.
    needs: [check, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    # Queue deploys rather than cancelling: interrupting a publish can leave
    # the live site half-updated.
    concurrency:
      group: pages
      cancel-in-progress: false

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/configure-pages@v6

      - name: Assemble site
        run: pnpm run build:site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5
