<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Golf Clash Wind Calculator</title>
    <meta
      name="description"
      content="Free Golf Clash wind calculator tool. Calculate wind rings for all clubs with power ball, elevation, and distance adjustments. Perfect for Golf Clash players. Alternative to windchum.com"
    />
    <meta
      name="keywords"
      content="golf clash, wind calculator, windchum.com, windchum, golf clash wind, wind rings, golf clash calculator, golf clash tool, gcwind"
    />
    <meta name="author" content="webthinking" />
    <meta name="theme-color" content="#3fa34d" />

    <!-- The app answers at webthinking.io/gcwind as well, so name the one
         address search engines should credit. Without it the two are
         duplicate content and the ranking signals split between them. -->
    <link rel="canonical" href="https://gcwind.webthinking.io/" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://gcwind.webthinking.io/" />
    <meta property="og:title" content="Golf Clash Wind Calculator" />
    <meta
      property="og:description"
      content="Free Golf Clash wind calculator tool. Calculate wind rings for all clubs with power ball, elevation, and distance adjustments. Alternative to windchum.com"
    />
    <meta property="og:site_name" content="gcwind" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Golf Clash Wind Calculator" />
    <meta
      name="twitter:description"
      content="Free Golf Clash wind calculator tool. Calculate wind rings for all clubs. Alternative to windchum.com"
    />

    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⛳</text></svg>"
    />
  </head>
  <body>
    <script>
      // Before the first paint, so a saved theme never flashes the other one.
      // Mirrors src/lib/theme.svelte.js; "auto" simply follows the OS.
      try {
        var t = localStorage.getItem('gcwind:theme');
        document.documentElement.dataset.theme = t === 'light' || t === 'dark' ? t : 'auto';
      } catch (e) {
        document.documentElement.dataset.theme = 'auto';
      }
    </script>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
